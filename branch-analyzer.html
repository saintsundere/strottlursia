<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Conversation — Branch Analyzer</title>
<style>
  :root { color-scheme: light dark; --accent:#4a90d9; --line:#8884; --branch:#b48ead; }
  * { box-sizing:border-box; }
  body { font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; margin:0; line-height:1.5; }
  header { display:flex; gap:14px; align-items:center; padding:12px 18px; border-bottom:1px solid var(--line); position:sticky; top:0; background:Canvas; z-index:5; }
  header h1 { font-size:1.05rem; margin:0; }
  header .grow { flex:1; }
  button { font-size:.9rem; padding:7px 14px; border-radius:8px; border:1px solid var(--line); background:var(--accent); color:#fff; cursor:pointer; }
  button.secondary { background:transparent; color:inherit; }
  .layout { display:flex; min-height:calc(100vh - 56px); }
  .sidebar { width:340px; border-right:1px solid var(--line); display:flex; flex-direction:column; position:sticky; top:56px; max-height:calc(100vh - 56px); }
  .search { padding:10px; border-bottom:1px solid var(--line); }
  .search input { width:100%; padding:7px 10px; border:1px solid var(--line); border-radius:8px; background:transparent; color:inherit; }
  .convlist { overflow:auto; flex:1; }
  .ci { padding:9px 12px; border-bottom:1px solid var(--line); cursor:pointer; }
  .ci:hover, .ci.active { background:var(--accent); color:#fff; }
  .ci .nm { font-weight:600; font-size:.9rem; }
  .ci .mt { font-size:.76rem; opacity:.78; }
  .ci .br { font-size:.76rem; font-weight:700; }
  .main { flex:1; padding:20px clamp(16px,4vw,48px); min-width:0; }
  .summary { background:#8881; border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:18px; }
  .summary b { font-size:1.4rem; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:12px; }
  .stat { text-align:center; }
  .stat .n { font-size:1.5rem; font-weight:700; display:block; }
  .stat .l { font-size:.74rem; opacity:.7; }

  .turn { display:flex; gap:10px; padding:8px 0; border-bottom:1px dashed var(--line); align-items:flex-start; }
  .tnum { font-variant-numeric:tabular-nums; opacity:.5; min-width:34px; font-size:.82rem; padding-top:2px; }
  .who { font-weight:700; min-width:78px; }
  .who.human { color:#2e7d32; } .who.assistant { color:var(--accent); }
  .preview { flex:1; min-width:0; font-size:.9rem; opacity:.85; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .branchnote { margin:2px 0 10px 122px; padding:7px 12px; border-left:3px solid var(--branch);
    background:#b48ead22; border-radius:6px; font-size:.85rem; }
  .branchnote b { color:var(--branch); }
  .empty { opacity:.6; text-align:center; padding:60px 20px; }
  code { background:#8882; padding:1px 5px; border-radius:4px; }
</style>
</head>
<body>
<header>
  <h1>🌳 Conversation Branch Analyzer</h1>
  <div class="grow"></div>
  <button id="loadBtn">Load conversations.json</button>
  <input id="file" type="file" accept=".json,application/json" hidden>
  <button id="copyBtn" class="secondary" style="display:none">Copy stats</button>
</header>

<div class="layout">
  <aside class="sidebar">
    <div class="search"><input id="search" type="text" placeholder="Search… (sorted by most branches)" disabled></div>
    <div class="convlist" id="convlist"><div class="empty" style="font-size:.85rem">Load your export to begin.</div></div>
  </aside>
  <main class="main" id="main"><div class="empty">Pick a conversation to see its branch map.</div></main>
</div>

<script>
let DATA=[], STATS=[];
const $=id=>document.getElementById(id);
const loadBtn=$('loadBtn'), fileInput=$('file'), search=$('search'),
      convlist=$('convlist'), main=$('main'), copyBtn=$('copyBtn');

loadBtn.onclick=()=>fileInput.click();
fileInput.onchange=()=>fileInput.files[0]&&read(fileInput.files[0]);

function read(file){
  loadBtn.textContent='Reading… ('+(file.size/1048576).toFixed(0)+' MB)';
  const r=new FileReader();
  r.onload=()=>{
    try{ const d=JSON.parse(r.result); DATA=Array.isArray(d)?d:(d.conversations||[d]); }
    catch(e){ alert('Parse error: '+e.message); loadBtn.textContent='Load conversations.json'; return; }
    loadBtn.textContent=DATA.length+' conversations';
    STATS=DATA.map((c,i)=>({i, ...analyze(c)}));
    search.disabled=false; copyBtn.style.display='';
    renderList('');
  };
  r.readAsText(file);
}

function tms(s){ const t=Date.parse(s); return isNaN(t)?0:t; }
function plainText(m){
  let s='';
  (m.content||[]).forEach(b=>{ if(b&&b.type==='text') s+=b.text||''; });
  if(!s) s=m.text||'';
  return s.replace(/\s+/g,' ').trim();
}

// Build tree, find main thread (root -> latest leaf), map branches onto it.
function analyze(c){
  const msgs=c.chat_messages||c.messages||[];
  const byId=new Map(msgs.map(m=>[m.uuid,m]));
  const kids=new Map();
  let roots=[];
  msgs.forEach(m=>{
    const p=m.parent_message_uuid;
    if(p&&byId.has(p)){ (kids.get(p)||kids.set(p,[]).get(p)).push(m); }
    else roots.push(m);
  });
  const childrenOf=m=>kids.get(m.uuid)||[];
  const subtreeSize=m=>{ let n=1; childrenOf(m).forEach(ch=>n+=subtreeSize(ch)); return n; };

  // active leaf = most recently created message
  let leaf=msgs[0];
  msgs.forEach(m=>{ if(tms(m.created_at)>=tms(leaf.created_at)) leaf=m; });

  // walk root -> leaf
  const path=[]; let cur=leaf, guard=0;
  while(cur && guard++<100000){ path.unshift(cur); const p=cur.parent_message_uuid; cur=(p&&byId.has(p))?byId.get(p):null; }

  // branches sitting on the main path
  const pathSet=new Set(path.map(m=>m.uuid));
  const branches=[];
  path.forEach((m,idx)=>{
    const ch=childrenOf(m);
    if(ch.length>1){
      const offPath=ch.filter(x=>!pathSet.has(x.uuid));
      if(offPath.length){
        const hidden=offPath.reduce((s,x)=>s+subtreeSize(x),0);
        branches.push({turn:idx+1, after:m, alternates:offPath.length, hidden});
      }
    }
  });

  return {
    name:(c.name&&c.name.trim())?c.name:'(untitled)',
    created:c.created_at,
    total:msgs.length,
    mainTurns:path.length,
    hidden:msgs.length-path.length,
    branchPoints:branches.length,
    roots:roots.length,
    path, branches
  };
}

search.oninput=()=>renderList(search.value.trim().toLowerCase());

function renderList(filter){
  convlist.innerHTML='';
  const items=STATS.filter(s=>!filter||s.name.toLowerCase().includes(filter))
                   .sort((a,b)=>b.branchPoints-a.branchPoints || b.total-a.total);
  if(!items.length){ convlist.innerHTML='<div class="empty" style="font-size:.85rem">No matches.</div>'; return; }
  items.forEach(s=>{
    const el=document.createElement('div');
    el.className='ci';
    el.innerHTML='<div class="nm"></div><div class="mt"></div>'
      +'<div class="br" style="color:'+(s.branchPoints?'#b48ead':'#888')+'">'
      +(s.branchPoints? '⎇ '+s.branchPoints+' branch point(s) · '+s.hidden+' hidden' : 'no branches')+'</div>';
    el.querySelector('.nm').textContent=s.name;
    el.querySelector('.mt').textContent=s.mainTurns+' main turns · '+s.total+' total messages';
    el.onclick=()=>{ document.querySelectorAll('.ci').forEach(x=>x.classList.remove('active')); el.classList.add('active'); renderDetail(s); };
    convlist.appendChild(el);
  });
}

function renderDetail(s){
  const branchByTurn=new Map(s.branches.map(b=>[b.turn,b]));
  let html='<div class="summary"><div class="grid">'
    +stat(s.mainTurns,'turns in main thread')
    +stat(s.total,'total messages in file')
    +stat(s.hidden,'hidden in branches')
    +stat(s.branchPoints,'branch points')
    +'</div></div>';
  html+='<h3 style="margin:.2rem 0">Main thread — turn by turn</h3>';
  s.path.forEach((m,idx)=>{
    const who=m.sender==='human'?'human':'assistant';
    const label=who==='human'?'User':'Claude';
    html+='<div class="turn"><span class="tnum">'+(idx+1)+'</span>'
      +'<span class="who '+who+'">'+label+'</span>'
      +'<span class="preview">'+escapeHtml(plainText(m).slice(0,160)||'(no text)')+'</span></div>';
    const b=branchByTurn.get(idx+1);
    if(b) html+='<div class="branchnote">⎇ <b>Branch here</b> (after turn '+b.turn+'): '
      +'<b>'+b.alternates+'</b> alternate version'+(b.alternates>1?'s':'')+' of the next turn '
      +'— <b>'+b.hidden+'</b> message'+(b.hidden>1?'s':'')+' hidden down '+(b.alternates>1?'those paths':'that path')+'.</div>';
  });
  main.innerHTML=html;
}

function stat(n,l){ return '<div class="stat"><span class="n">'+n+'</span><span class="l">'+l+'</span></div>'; }
function escapeHtml(s){ return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

copyBtn.onclick=()=>{
  let t='BRANCH STATS — '+DATA.length+' conversations\n';
  const tot=STATS.reduce((a,s)=>({total:a.total+s.total,main:a.main+s.mainTurns,hidden:a.hidden+s.hidden,bp:a.bp+s.branchPoints}),{total:0,main:0,hidden:0,bp:0});
  t+='Across all: '+tot.total+' total messages · '+tot.main+' main-thread turns · '+tot.hidden+' hidden in branches · '+tot.bp+' branch points\n\n';
  t+='Top branched conversations:\n';
  STATS.slice().sort((a,b)=>b.branchPoints-a.branchPoints).slice(0,15).forEach(s=>{
    t+='• "'+s.name+'": '+s.mainTurns+' main turns, '+s.total+' total, '+s.hidden+' hidden, '+s.branchPoints+' branch points\n';
  });
  navigator.clipboard.writeText(t).then(()=>{ copyBtn.textContent='Copied!'; setTimeout(()=>copyBtn.textContent='Copy stats',1200); });
};
</script>
</body>
</html>
