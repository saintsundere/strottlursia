<title>The Ninth Room</title>
<style>
  :root{
    --night:#1c2340; --deep:#0d1226; --wall:#242e52; --wood:#3a2c26;
    --parch:#ece0c8; --parch2:#dfd1b2; --ink:#241f1a; --ink-soft:#4a4038;
    --red:#a8232e; --red2:#c73340; --gold:#c9a35a; --gold2:#e3c98c;
    --frost:#bcd7e6; --skin:#f2dcc8; --hair:#3b2a20;
    --serif:Georgia,'Iowan Old Style','Palatino Linotype','Times New Roman',serif;
  }
  html,body{height:100%;}
  body{margin:0;background:var(--deep);overflow:hidden;font-family:var(--serif);color:var(--parch);}
  #viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:960px;height:540px;background:var(--night);overflow:hidden;
    transform-origin:center center;box-shadow:0 0 90px rgba(0,0,0,.8);}
  #stage *{user-select:none;-webkit-user-select:none;}
  .layer{position:absolute;inset:0;}
  svg{display:block;}
  button{font-family:var(--serif);}
  :is(button,.choice):focus-visible{outline:2px solid var(--gold);outline-offset:2px;}

  /* ---------- frost & grade ---------- */
  #frost{pointer-events:none;opacity:0;transition:opacity 1.2s ease;
    background:
      radial-gradient(120% 90% at 50% 45%, transparent 52%, rgba(188,215,230,.28) 82%, rgba(214,236,246,.55) 100%),
      linear-gradient(to top, rgba(160,196,214,.18), transparent 22%),
      linear-gradient(to bottom, rgba(188,215,230,.14), transparent 18%);}
  #grade{pointer-events:none;opacity:0;transition:opacity 2s ease;
    background:radial-gradient(90% 80% at 50% 50%, transparent 40%, rgba(6,8,18,.55) 100%);}
  #consMist{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity 2.4s ease;
    background:
      linear-gradient(to top, rgba(203,222,216,.9), rgba(203,222,216,.3) 46%, transparent 78%),
      linear-gradient(to bottom, rgba(203,222,216,.25), transparent 24%);}
  .breathe{animation:brth 5.5s ease-in-out infinite;transform-origin:742px 276px;}
  @keyframes brth{50%{transform:scale(1.05);}}

  /* ---------- dialogue ---------- */
  #dialog{position:absolute;left:0;right:0;bottom:0;padding:14px 26px 16px;display:none;
    background:linear-gradient(to bottom, rgba(13,18,38,0), rgba(13,18,38,.55) 18%, rgba(10,14,30,.92) 60%);}
  #dialog.on{display:block;}
  .dbox{max-width:660px;}
  #dspeaker{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin:0 0 4px 2px;}
  #dspeaker.tom{color:var(--red2);}
  #dspeaker.nar{color:#8d97b8;}
  #dtext{margin:0;font-size:19px;line-height:1.5;color:#f3ecdc;min-height:56px;text-shadow:0 1px 2px rgba(0,0,0,.6);}
  #dtext .em{color:var(--gold2);font-style:italic;}
  #dnext{position:absolute;right:26px;bottom:14px;color:var(--gold);font-size:13px;letter-spacing:.14em;
    text-transform:uppercase;opacity:.85;animation:bob 1.6s ease-in-out infinite;}
  @keyframes bob{50%{transform:translateY(-3px);}}
  #dchoices{list-style:none;display:none;flex-direction:column;gap:7px;margin:10px 0 0;padding:0;max-width:620px;}
  #dchoices.on{display:flex;}
  .choice{border:0;text-align:left;cursor:pointer;padding:9px 14px 9px 16px;font-size:16.5px;line-height:1.35;
    color:var(--ink);background:linear-gradient(var(--parch),var(--parch2));border-left:3px solid var(--red);
    box-shadow:0 2px 0 rgba(0,0,0,.45);transition:transform .12s ease;}
  .choice:hover{transform:translateX(5px);border-left-color:var(--red2);}

  /* ---------- portrait ---------- */
  #portrait{position:absolute;right:22px;bottom:118px;width:225px;pointer-events:none;
    filter:drop-shadow(0 10px 24px rgba(0,0,0,.6));transition:opacity .5s ease, transform .5s ease;
    opacity:0;transform:translateY(10px);}
  #portrait.on{opacity:1;transform:none;}
  #portrait .plate{font-size:11px;letter-spacing:.26em;text-transform:uppercase;text-align:center;
    color:var(--gold);margin-top:4px;opacity:.85;}
  /* portrait transitions */
  #pBrowL,#pBrowR,#pLidL,#pLidR,#pIris,#pBlush,#pHeadTilt{transition:transform .5s ease, opacity .5s ease;}

  /* ---------- hud ---------- */
  #hud{position:absolute;left:0;right:0;top:0;display:none;justify-content:space-between;padding:12px 14px;pointer-events:none;}
  #hud.on{display:flex;}
  .chip{pointer-events:auto;cursor:pointer;border:1px solid rgba(201,163,90,.45);background:rgba(10,14,30,.72);
    color:var(--parch);font-size:12px;letter-spacing:.18em;text-transform:uppercase;padding:7px 12px;}
  .chip:hover{border-color:var(--gold);color:var(--gold2);}
  #notebookBtn{border-left:4px solid var(--red);}
  #notebookBtn.pulse{animation:ledger .9s ease 2;}
  @keyframes ledger{30%{box-shadow:0 0 0 3px rgba(199,51,64,.7);}}
  #hint{position:absolute;top:13px;left:50%;transform:translateX(-50%);font-size:12.5px;letter-spacing:.14em;
    text-transform:uppercase;color:#9aa5c6;opacity:0;transition:opacity .4s;pointer-events:none;}
  #hint.on{opacity:.9;}

  /* ---------- overlays: notebook & herald ---------- */
  #overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    background:rgba(6,8,18,.72);}
  #overlay.on{display:flex;}
  .book{width:700px;height:430px;display:flex;background:var(--red);padding:10px 10px 14px;
    box-shadow:0 18px 50px rgba(0,0,0,.7);transform:rotate(-.4deg);}
  .page{flex:1;background:linear-gradient(100deg,var(--parch) 70%,var(--parch2));color:var(--ink);
    padding:20px 22px;overflow:hidden;position:relative;}
  .page+.page{border-left:2px solid rgba(0,0,0,.18);}
  .page h3{margin:0 0 4px;font-size:13px;letter-spacing:.26em;text-transform:uppercase;color:var(--red);}
  .page .sub{font-size:12px;font-style:italic;color:var(--ink-soft);margin:0 0 12px;}
  .legends{list-style:none;margin:0;padding:0;font-size:14.5px;line-height:1.9;}
  .legends li{border-bottom:1px dotted rgba(0,0,0,.25);display:flex;justify-content:space-between;}
  .legends .st{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#9a8a6d;align-self:center;}
  .people p{margin:7px 0;font-size:14px;line-height:1.35;}
  .people b{font-weight:normal;letter-spacing:.06em;}
  .people .note{color:var(--ink-soft);font-style:italic;font-size:12.5px;}
  .redline{color:var(--red);}
  #ovClose{position:absolute;top:10px;right:14px;background:none;border:0;color:var(--parch);
    font-size:22px;cursor:pointer;line-height:1;}
  .navRow{position:absolute;right:26px;bottom:24px;display:flex;gap:10px;}
  .navBtn{background:none;border:1px solid rgba(168,35,46,.45);color:var(--red);cursor:pointer;
    font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;padding:5px 10px;}
  .navBtn:hover{background:rgba(168,35,46,.1);border-color:var(--red);}

  .herald{width:640px;max-height:480px;overflow:hidden;background:linear-gradient(175deg,#f2e8d2,#e6d8ba);
    color:var(--ink);padding:26px 34px 30px;box-shadow:0 18px 50px rgba(0,0,0,.7);}
  .herald.clip{width:520px;transform:rotate(-1.2deg);
    clip-path:polygon(1% 3%,6% 0,94% 1%,100% 6%,99% 96%,93% 100%,4% 99%,0 93%);}
  .masthead{text-align:center;border-bottom:3px double var(--ink);padding-bottom:8px;margin-bottom:8px;}
  .masthead h2{margin:0;font-size:30px;letter-spacing:.24em;font-weight:normal;}
  .masthead p{margin:3px 0 0;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-soft);}
  .herald h1{font-size:25px;line-height:1.15;margin:10px 0 2px;text-wrap:balance;font-weight:normal;}
  .herald .deck{font-style:italic;color:var(--ink-soft);margin:0 0 10px;font-size:14px;}
  .cols{column-count:2;column-gap:22px;column-rule:1px solid rgba(0,0,0,.2);font-size:13.5px;line-height:1.5;}
  .cols p{margin:0 0 8px;}
  .stat{font-size:12px;letter-spacing:.05em;}
  .stat b{font-weight:normal;color:var(--red);}
  .heraldBtns{text-align:center;margin-top:14px;}
  .heraldBtns .choice{display:inline-block;border-left:none;border-top:3px solid var(--red);padding:8px 22px;}

  /* ---------- title ---------- */
  #title{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:56px;
    text-align:center;cursor:pointer;pointer-events:auto;}
  #title h1{margin:0;font-size:52px;font-weight:normal;letter-spacing:.34em;text-indent:.34em;color:var(--parch);
    text-shadow:0 0 30px rgba(201,163,90,.25), 0 2px 0 rgba(0,0,0,.6);}
  #title .rooms{color:var(--gold2);}
  #title p{margin:8px 0 0;font-size:13px;letter-spacing:.24em;text-transform:uppercase;color:#9aa5c6;}
  #title .credit{font-size:11.5px;color:var(--gold);letter-spacing:.18em;}
  #knock{margin-top:26px;background:none;border:1px solid var(--gold);color:var(--gold2);
    letter-spacing:.3em;text-transform:uppercase;font-size:13px;padding:10px 30px;cursor:pointer;
    animation:breathe 2.6s ease-in-out infinite;}
  #knock:hover{background:rgba(201,163,90,.12);}
  @keyframes breathe{50%{opacity:.55;}}

  #sprites, #scene{pointer-events:none;}
  #scene .hot{pointer-events:auto;cursor:pointer;}
  #scene .walk{pointer-events:auto;cursor:crosshair;}
  #sprites svg{position:absolute;transition:none;}
  .flicker{animation:fl 3.4s ease-in-out infinite;}
  .flicker.f2{animation-duration:2.7s;animation-delay:.6s;}
  .flicker.f3{animation-duration:4.1s;animation-delay:1.1s;}
  @keyframes fl{45%{opacity:.72;}52%{opacity:1;}78%{opacity:.85;}}
  @media (prefers-reduced-motion: reduce){
    *{animation:none !important;transition:none !important;}
  }
</style>

<script>
'use strict';
/* ================================================================
   THE NINTH ROOM — playable slice v0.1
   doorstep router → foyer → herald end-card
   ================================================================ */
const TRACKS = /*__MUSIC__*/null;   // {coral, mist, widow} — all composed by Clarey

const $ = s => document.querySelector(s);
const stage = $('#stage'), sceneL = $('#scene'), spritesL = $('#sprites');

/* ---------- game state ---------- */
const G = {
  trust: 50, warmth: 100, minWarmth: 100,
  route: null,            // 'escort' | 'alone'
  flags: {}, seen: {}, coldCount: 0, ledgerTripped: false,
  scene: 'title',
};

/* ---------- stage scaling ---------- */
function fit(){
  const s = Math.min(innerWidth/960, innerHeight/540);
  stage.style.transform = `scale(${s})`;
}
addEventListener('resize', fit); fit();

/* ================================================================
   MUSIC — tiny WebAudio piano for Clarey's MIDI
   ================================================================ */
const Snd = {
  ctx:null, master:null, musicGain:null, on:true, timer:null,
  track:null, startAt:0, idx:0, swapT:null,
  clockTimer:null, nextTick:0, tickN:0, noise:null,
  begin(){
    if (this.ctx || !TRACKS) return;
    const C = new (window.AudioContext||window.webkitAudioContext)();
    this.ctx = C;
    const comp = C.createDynamicsCompressor();
    comp.threshold.value = -18; comp.ratio.value = 6;
    this.master = C.createGain(); this.master.gain.value = 0.85;
    this.master.connect(comp); comp.connect(C.destination);
    this.musicGain = C.createGain(); this.musicGain.gain.value = 0;
    this.musicGain.connect(this.master);
    this.timer = setInterval(()=>this.pump(), 120);
  },
  setMusic(on, fade=2){
    if (!this.ctx) return;
    const g = this.musicGain.gain, t = this.ctx.currentTime;
    g.cancelScheduledValues(t); g.setValueAtTime(g.value, t);
    g.linearRampToValueAtTime(on ? 1 : 0, t + fade);
  },
  play(name, fade=1.8){
    if (!this.ctx || !TRACKS || !TRACKS[name]) return;
    if (this.track === name){ this.setMusic(true, fade); return; }
    clearTimeout(this.swapT);
    const hadTrack = !!this.track;
    if (hadTrack) this.setMusic(false, fade);
    this.swapT = setTimeout(()=>{
      this.track = name; this.idx = 0;
      this.startAt = this.ctx.currentTime + 0.3;
      this.setMusic(true, hadTrack ? 1.4 : 0.8);
    }, hadTrack ? fade*1000 : 0);
  },
  stop(fade=2){
    if (!this.ctx) return;
    clearTimeout(this.swapT);
    this.setMusic(false, fade);
    this.swapT = setTimeout(()=>{ this.track = null; }, fade*1000 + 100);
  },
  clockStart(){
    if (!this.ctx || this.clockTimer) return;
    if (!this.noise){
      const C = this.ctx, len = C.sampleRate*0.05|0, b = C.createBuffer(1, len, C.sampleRate), d = b.getChannelData(0);
      let seed = 7;
      for (let i=0;i<len;i++){ seed = (seed*16807)%2147483647; d[i] = ((seed/2147483647)*2-1) * Math.pow(1-i/len, 2); }
      this.noise = b;
    }
    this.nextTick = Math.ceil(this.ctx.currentTime) + 0.5; this.tickN = 0;
    this.clockTimer = setInterval(()=>{
      const C = this.ctx;
      while (this.nextTick < C.currentTime + 0.6){ this.tick(this.nextTick, this.tickN++ % 2); this.nextTick += 1; }
    }, 150);
  },
  clockStop(){ clearInterval(this.clockTimer); this.clockTimer = null; },
  tick(when, alt){
    const C = this.ctx, src = C.createBufferSource(); src.buffer = this.noise;
    const bp = C.createBiquadFilter(); bp.type = 'bandpass';
    bp.frequency.value = alt ? 1450 : 2050; bp.Q.value = 9;
    const g = C.createGain();
    g.gain.setValueAtTime(alt ? 0.05 : 0.065, when);
    g.gain.setTargetAtTime(0, when + 0.012, 0.02);
    src.connect(bp); bp.connect(g); g.connect(this.master);
    src.start(when); src.stop(when + 0.06);
  },
  pump(){
    if (!this.on || !this.track) return;
    const T = TRACKS[this.track];
    const C = this.ctx, notes = T.notes, ahead = C.currentTime + 0.45;
    while (this.idx < notes.length && this.startAt + notes[this.idx][0] < ahead){
      const [t, m, d, v] = notes[this.idx++];
      this.voice(this.startAt + t, m, d, v);
    }
    if (this.idx >= notes.length){                       // loop with a breath
      this.startAt = this.startAt + T.duration + 4.5;
      this.idx = 0;
    }
  },
  voice(when, midi, dur, vel){
    const C = this.ctx, f = 440 * Math.pow(2, (midi-69)/12);
    const g = C.createGain();
    const lp = C.createBiquadFilter(); lp.type='lowpass';
    lp.frequency.value = Math.min(2400, 700 + f*2.2);
    const o1 = C.createOscillator(); o1.type='triangle'; o1.frequency.value = f;
    const o2 = C.createOscillator(); o2.type='sine';     o2.frequency.value = f*2;
    const g2 = C.createGain(); g2.gain.value = 0.22;
    const pan = C.createStereoPanner ? C.createStereoPanner() : null;
    if (pan) pan.pan.value = Math.max(-0.5, Math.min(0.5, (midi-62)/40));
    o1.connect(lp); o2.connect(g2); g2.connect(lp); lp.connect(g);
    pan ? (g.connect(pan), pan.connect(this.musicGain)) : g.connect(this.musicGain);
    const peak = 0.05 + vel*0.13;
    g.gain.setValueAtTime(0, when);
    g.gain.linearRampToValueAtTime(peak, when + 0.012);
    g.gain.setTargetAtTime(0, when + Math.max(0.05, dur*0.85), 0.16 + dur*0.22);
    o1.start(when); o2.start(when);
    const stop = when + dur*1.6 + 1.2;
    o1.stop(stop); o2.stop(stop);
  },
  toggle(){
    this.on = !this.on;
    $('#soundBtn').textContent = 'sound: ' + (this.on ? 'on' : 'off');
    if (this.master) this.master.gain.value = this.on ? 0.85 : 0;

function restingFace(){
  const t = G.trust;
  return t<=38?'hostile' : t<=48?'wary' : t<=58?'guarded' : t<=68?'thaw' : 'warm';
}
function faceLabel(){
  return {hostile:'cold', wary:'wary', guarded:'guarded', thaw:'thawing', warm:'almost warm'}[restingFace()];
}
function setFace(name){
  const f = FACES[name] || FACES[restingFace()];
  $('#pBrowL').setAttribute('transform', f.browL);

/* ================================================================
   WARMTH — frost, jacket, ledger
   ================================================================ */
function mix(a, b, t){
  const A = parseInt(a.slice(1),16), B = parseInt(b.slice(1),16);
  const c = i => Math.round(((A>>i&255)*(1-t)) + ((B>>i&255)*t));
  return `rgb(${c(16)},${c(8)},${c(0)})`;
}
function applyWarmth(){
  const lost = (100 - G.warmth)/100;
  $('#frost').style.opacity = Math.min(1, lost*1.6);
  $('#grade').style.opacity = G.warmth < 50 ? .9 : lost*.8;
  const jack = mix('#f0f1f4', '#5f7fc0', Math.min(1, lost*1.25));
  document.querySelectorAll('.jacket').forEach(el=>el.setAttribute('fill', jack));
  const skin = mix('#f2dcc8', '#cfd4de', Math.min(1, lost));
  document.querySelectorAll('.tskin').forEach(el=>el.setAttribute('fill', skin));
}
function stealWarmth(n){
  G.warmth = Math.max(4, G.warmth - n);
  G.minWarmth = Math.min(G.minWarmth, G.warmth);
  const tripped = !G.ledgerTripped && G.minWarmth < 50;
  if (tripped){ G.ledgerTripped = true; $('#notebookBtn').classList.add('pulse'); }
  applyWarmth();
  return tripped;
}

   ================================================================ */
const D = {
  el: $('#dialog'), sp: $('#dspeaker'), tx: $('#dtext'),
  ch: $('#dchoices'), nx: $('#dnext'),
  nodes:null, typing:null, resolve:null, busy:false,

  run(nodes, start){
    this.nodes = nodes;
    this.el.classList.add('on');
    return new Promise(res => { this.resolve = res; this.go(start); });
  },
  end(v){
    this.el.classList.remove('on'); portrait(false);
    const r = this.resolve; this.resolve = null; if (r) r(v);
  },
  abort(){                                  // hard reset — the notebook's escape hatches use this
    clearTimeout(this.typing); this.skip = null;
    this.el.classList.remove('on');
    this.ch.classList.remove('on'); this.ch.innerHTML = '';
    portrait(false);
    const r = this.resolve; this.resolve = null; if (r) r('aborted');
  },
  go(id){
    const n = this.nodes[id];
    if (!n) return this.end(id);
    if (n.do) { const jump = n.do(); if (jump) return this.go(jump); }
    if (n.trust){ G.trust = Math.max(5, Math.min(95, G.trust + n.trust)); }
    if (n.end !== undefined) return this.end(n.end);

    const who = n.sp || 'N';
    this.sp.textContent = who==='S' ? 'Saskia' : who==='T' ? 'Tomren' : '';
    this.sp.className = who==='T' ? 'tom' : who==='N' ? 'nar' : '';
    if (who==='S'){ portrait(true); setFace(n.face || restingFace()); }
    else if (n.hideP) portrait(false);

    this.type(n.text, ()=>{
      if (n.choices){
        this.nx.hidden = true;
        this.ch.innerHTML = '';
        this.ch.classList.add('on');
        n.choices.filter(c=>!c.hide || !c.hide()).forEach(c=>{
          const li = document.createElement('li');
          const b = document.createElement('button');
          b.className = 'choice'; b.textContent = c.text;
          b.addEventListener('click', e=>{
            e.stopPropagation();
            this.ch.classList.remove('on');
            if (c.trust) G.trust = Math.max(5, Math.min(95, G.trust + c.trust));
            if (c.set) c.set();
            this.go(c.next);
          });
          li.appendChild(b); this.ch.appendChild(li);
        });
      } else {
        this.nx.hidden = false;
        this.await(()=>this.go(n.next));
      }
    });
  },
  type(text, done){
    clearTimeout(this.typing);
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    this.tx.innerHTML = ''; this.nx.hidden = true; this.ch.classList.remove('on');
    if (reduce){ this.tx.innerHTML = text; done(); return; }
    let i = 0; const plain = text;
    const step = ()=>{
      i += 2;
      this.tx.innerHTML = plain.slice(0, i);
      if (i < plain.length) this.typing = setTimeout(step, 14);
      else { this.skip = null; done(); }
    };
    this.skip = ()=>{ clearTimeout(this.typing); this.tx.innerHTML = plain; this.skip=null; done(); };
    step();
  },
  await(fn){
    const h = e => {
      e.stopPropagation();
      this.el.removeEventListener('click', h);
      fn();
    };
    setTimeout(()=>this.el.addEventListener('click', h), 60);
  },
};
D.el.addEventListener('click', ()=>{ if (D.skip) D.skip(); });

  async intro(){
    if (!G.seen.foyerIntro){
      G.seen.foyerIntro = true;
      if (G.route === 'escort'){
        await say([['N','The foyer smells like a church that changed religions. Saskia stops at the foot of the stairs and does not put the keys away.'],
                   ['S','“Well. Photograph it, project-boy.”']]);
      } else {
        await say([['N','The foyer smells like a church that changed religions. From somewhere left, the sound of a kettle — she meant it about the kitchen.'],
                   ['N','Nobody is watching you. In this house that is not the same as being unobserved.']]);
      }
      hint('click the floor to walk · click things to look');
      return;
    }
    if (G.flags.memento && !G.seen.hookBack){
      G.seen.hookBack = true;
      if (G.route === 'escort'){
        if (G.trust >= 59) await say([['S','Her eyes go to the hook in your satchel and stay there one full tick of the clock. “…Keep it somewhere warm.”']]);
        else await say([['S','“The house saw that.” It is not clear she means it as a warning. It is not clear she means it as anything.']]);
      } else {
        await say([['N','The foyer clock does not change its pace. Somehow this is worse than if it had.']]);
      }
    }
  },

  bind(){
    const svg = sceneL.querySelector('svg');
    const pt = e => {
      const r = svg.getBoundingClientRect();
      return { x:(e.clientX-r.left) * 960/r.width, y:(e.clientY-r.top) * 540/r.height };
    };
    svg.querySelector('#walkFloor').addEventListener('click', e=>{
      if (Tom.busy || D.el.classList.contains('on')) return;
      const p = pt(e);
      if (p.x < 105 && p.y < 468){         // lower half of the front door sits on the walk strip
        const h = this.hotspots.find(h=>h.sel==='#hsFront');
        if (Math.abs(Tom.x - h.x) < 80) return h.fn();
        Tom.tx = h.x + 60; Tom.ty = 470; Tom.pending = h; return;
      }
      if (p.x >= 138 && p.x <= 214 && p.y < 458){   // the brazier's feet, likewise
        const h = this.hotspots.find(h=>h.sel==='#hsBrazier');
        if (Math.abs(Tom.x - h.x) < 80) return h.fn();
        Tom.tx = h.x + 55; Tom.ty = 472; Tom.pending = h; return;
      }
      Tom.tx = Math.max(60, Math.min(920, p.x));
      Tom.ty = Math.max(440, Math.min(516, p.y));
      Tom.pending = null;
    });
    this.hotspots = [
      {sel:'#hsChandelier', x:600, name:'the chandelier',    fn:()=>this.chandelier()},
      {sel:'#hsPortraits',  x:390, name:'the eight portraits', fn:()=>this.portraits()},
      {sel:'#hsBrazier',    x:200, name:'the brazier',       fn:()=>this.brazier()},
      {sel:'#hsGlass',      x:380, name:'the glass door',    fn:()=>this.glass()},
      {sel:'#hsChapelDoor', x:472, name:'the stone arch',    fn:()=>this.chapelDoor()},
      {sel:'#hsPole',       x:690, name:'the umbrella stand', fn:()=>this.pole()},
      {sel:'#hsCellar',     x:598, name:'the cellar door',   fn:()=>this.cellar()},
      {sel:'#hsEast',       x:800, name:'the east door',     fn:()=>this.east()},
      {sel:'#hsFront',      x:70,  name:'the front door',    fn:()=>this.front()},
    ];
    for (const h of this.hotspots){
      const el = svg.querySelector(h.sel);
      el.classList.add('hot');
      el.addEventListener('mouseenter', ()=>hint(h.name));
      el.addEventListener('mouseleave', ()=>hint(''));
      el.addEventListener('click', e=>{
        e.stopPropagation();
        if (Tom.busy || D.el.classList.contains('on')) return;
        if (Math.abs(Tom.x - h.x) < 80) h.fn();
        else { Tom.tx = h.x + (Tom.x < h.x ? -60 : 60); Tom.ty = 470; Tom.pending = h; }
      });
    }
  },

  loop(now){
    const dt = Math.min(0.05, (now - (this.last||now))/1000); this.last = now;
    const dx = Tom.tx - Tom.x, dy = Tom.ty - Tom.y;
    const dist = Math.hypot(dx, dy);
    const tom = $('#tom');
    if (dist > 3 && !Tom.busy){
      Tom.walking = true;
      Tom.dir = dx < -1 ? -1 : dx > 1 ? 1 : Tom.dir;
      Tom.x += dx/dist * Tom.speed * dt;
      Tom.y += dy/dist * Tom.speed * dt * .7;
      Tom.ft += dt;
      if (Tom.ft > 0.15){ Tom.ft = 0; Tom.frame = 1 - Tom.frame; }
      // cold spot check
      if (Math.hypot(Tom.x-600, Tom.y-470) < 46 && !Tom.busy) this.coldspot();
    } else {
      if (Tom.walking && Tom.pending){ const h = Tom.pending; Tom.pending = null; h.fn(); }
      Tom.walking = false; Tom.frame = 0;
    }
    if (tom){
      const sc = 0.86 + (Tom.y - 440)*0.004;
      tom.style.left = (Tom.x - 33) + 'px';
      tom.style.top  = (Tom.y - 102) + 'px';
      tom.querySelector('#tomFlip').setAttribute('transform', `scale(${Tom.dir*sc} ${sc})`);
      tom.querySelector('#legA').style.display = Tom.frame ? 'none' : '';
      tom.querySelector('#legB').style.display = Tom.frame ? '' : 'none';
    }
    this.raf = requestAnimationFrame(t=>this.loop(t));
  },

  /* ----- hotspot scripts ----- */
  async chandelier(){
    await busy(async ()=>{
      await say([['N','Eight candles. No draft, and yet each flame leans — very slightly, very politely — toward the cellar door.'],

        await say([['N','The stone is not a stone. Your foot goes through the skin of the world—'],
                   ['N','One note. Not loud. The mist lies down flat, all of it, at once, obedient — and your hand finds stone that was not there before.'],
                   ['S','On the bank, Saskia lowers the gold whistle from her lips. She does not put it away again for the rest of the room.']]);
      } else {
        const tripped = stealWarmth(12);
        await say([['N','The stone is not a stone. The water is exactly as deep as the legend needs it to be — and cold does the counting for you: twelve.'],
                   ['N','You haul yourself back to the bank, streaming, lighter in a way that has nothing to do with water.']]);
        if (tripped) await this.ledgerLines();
        if (G.route==='escort' && G.trust<39) await say([['S','From the bank, mildly: “Shallow-ish.”']]);
      }
    });
    const back = saved ? this.stones.filter(x=>x.safe && this.reach(x, s))[0] : null;
    if (saved && back){
      await this.hopTo(back, ()=>{ st.pos='stone'; st.stone=this.stones.indexOf(back); });
    } else {
      await this.hopTo(this.BANK, ()=>{ st.pos='bank'; st.stone=-1; }, 700);
    }

  async ledgerLines(){
    await say([['N','Something in the ledger of the house turns a page. A door you will never get to see — closes.'],
               ['N','<span class="em">Warmth has fallen below half. In the full game, the human good ending just left the building.</span>']]);
  },

  hopTo(target, apply, dur=330){
    return new Promise(res=>{
      this.hopping = true;
      const sx = Tom.x, sy = Tom.y, dx = target.x - sx, dy = (target.y - (target===this.BANK ? 4 : 14)) - sy;
      const t0 = performance.now();
      const step = now=>{
        const k = Math.min(1, (now-t0)/dur);
        Tom.x = sx + dx*k; Tom.y = sy + dy*k - Math.sin(k*Math.PI)*26;
        Tom.dir = dx<0 ? -1 : 1;
        if (k<1) requestAnimationFrame(step);
        else { apply && apply(); Tom.tx=Tom.x; Tom.ty=Tom.y; this.hopping=false; res(); }
      };
      requestAnimationFrame(step);
    });
  },

  loop(now){
    const dt = Math.min(0.05, (now-(this.last||now))/1000); this.last = now;
    const tom = $('#tom');
    if (G.cons.pos==='bank' && !this.hopping){
      const dx = Tom.tx-Tom.x, dy = Tom.ty-Tom.y, dist = Math.hypot(dx,dy);
      if (dist>3 && !Tom.busy){
        Tom.walking = true;
        Tom.dir = dx<-1 ? -1 : dx>1 ? 1 : Tom.dir;
        Tom.x += dx/dist*Tom.speed*dt; Tom.y += dy/dist*Tom.speed*dt*.7;
        Tom.ft += dt; if (Tom.ft>0.15){ Tom.ft=0; Tom.frame=1-Tom.frame; }
      } else { Tom.walking=false; Tom.frame=0; }
    }
    if (tom){
      const sc = 0.62 + Math.max(0,(Tom.y-380))*0.0024;
      tom.style.left = (Tom.x-33)+'px';
      tom.style.top  = (Tom.y-102)+'px';

      tom.querySelector('#legB').style.display = Tom.frame ? '':'none';
    }
    this.raf = requestAnimationFrame(t=>this.loop(t));
  },

  mistPump(){
    if (D.el.classList.contains('on')) return;             // the room waits its turn
    if (!G.flags.memento) this.mist = Math.min(100, this.mist + 1.1);
    const m = $('#consMist');
    if (m) m.style.opacity = Math.min(.92, this.mist/100);

      this.drainAcc++;
      const every = G.flags.pole ? 9 : 5;
      if (this.drainAcc >= every){
        this.drainAcc = 0;
        const tripped = stealWarmth(1);

  async pane(){
    await busy(async ()=>{

    });
  },

  async page(){
    const st = G.cons;
    if (!(st.pos==='stone' && (st.stone===2 || st.stone===3))){ hint('can’t reach it from here'); return; }
    await busy(async ()=>{
      await say([['N','A page, floating face-up, dry-side-up, in defiance of several policies water usually has. Corwen’s handwriting — you would know it anywhere: <span class="em">ferry logs 1802–. eight generations. every keeper one family. M—</span>'],
                 ['N','The word ends midstroke.']]);
      const nodes = {
        q:{sp:'N', text:'It is an arm’s length out over open water.', choices:[
          {text:'Reach for it by hand.', next:'hand'},
          {text:'Skate it home with the pole.', next:'pole', hide:()=>!G.flags.pole},
        ]},
        hand:{do:()=>{ stealWarmth(3); return 'hand2'; }},
        hand2:{sp:'N', text:'You reach. The pond reaches back — a lurch, a lungful of fright, three degrees gone to somewhere with a ledger. But the page is yours.', end:true},
        pole:{sp:'N', text:'You skate it across the surface with the pole, the way eight generations of one family landed their fares.', end:true},
      };
      await D.run(nodes, 'q');
      G.flags.page = true;
      const el = sceneL.querySelector('#hsPage'); if (el) el.style.display='none';
      hint('the notebook felt that · check ✎');
    });
  },

  async exhibit(){
    if (G.cons.pos!=='far' && !(G.cons.pos==='stone' && G.cons.stone>=5)){ hint('cross the water first'); return; }
    if (G.cons.pos!=='far') await this.hopTo(this.LEDGE, ()=>{ G.cons.pos='far'; G.cons.stone=-1; });
    await busy(async ()=>{
      await say([['N','The Greylock. Wingspan of a dinner tray, pinned under museum glass, with a brass plate someone engraved by hand: <span class="em">WIDOWMERE — DO NOT WIND.</span>']]);
      if (G.warmth < 65) await say([['N','The wings are moving. Slowly. In and out. On a pinned thing. Like patient lungs that have read your project and found it thorough.']]);
      if (G.warmth < 50) await say([['N','And in the far corner, the mist is standing up in the shape of something with too many shoulders. It is politely facing away. It has been facing away the entire time you have been in this room.']]);
      G.seen.greylock = true;
    });
  },

  async hook(){
    if (G.cons.pos!=='far' && !(G.cons.pos==='stone' && G.cons.stone>=5)){ hint('cross the water first'); return; }
    if (G.cons.pos!=='far') await this.hopTo(this.LEDGE, ()=>{ G.cons.pos='far'; G.cons.stone=-1; });
    await busy(async ()=>{

                 ['N','—it settles. Slowly. Like a house deciding, for now, to go on being a house. The Conservatory is quiet. It is a different quiet than before, and it has a different song in it.']]);

      const hk = sceneL.querySelector('#hsHook'); if (hk) hk.style.display='none';
      if (G.route==='escort'){
        if (G.trust>=59) await say([['S','From the bank, very level, not loudly: “Tomren. Walk back now, please. Not quickly.”']]);

      }
      hint('the pond is honest now · walk back');
    });
  },

  async leave(){
    if (G.cons.pos!=='bank'){ hint('cross back to the door first'); return; }
    await busy(async ()=>{
      if (G.route==='escort' && !G.flags.memento && G.seen.greylock)
        await say([['S','“Done?” She is through the door before you answer it.']]);
      go('foyer');
    });
  },
};

        await say([['N','The shadows on the benches sit at shoulder intervals. When you look straight at them they are just shadows. They are very good at being just shadows.']]);
      if (G.warmth < 50 && !G.flags.memento2)
        await say([['N','In the last pew, nearest you, someone is seated. Politely facing the front. You are almost entirely sure the pew was empty when you came in.']]);
    });
  },
  async grate(){
    await busy(async ()=>{
      const st = G.chap;
      if (G.flags.memento2){
        await say([['N','The water under the grate is still. On the iron, where the waterline used to reach: Elah’s hairpin — set <span class="em">on top</span> now, dry, placed the way you place a thing you are returning.']]);
        return;
      }
      if (!st.grateSeen){
        st.grateSeen = true;
        await say([['N','A cistern under an iron grate. The tune lives here — rising, circling, leaving its spaces. And at the waterline, caught on the iron: a silver hairpin, bent.'],
                   ['N','Elah’s. Corwen won it for her at the Graincross fair, third try, and you all pretended the game wasn’t rigged. She never took it out of her hair after that.']]);
        G.flags.elahPin = true;
        const pin = sceneL.querySelector('#hsGrate g[transform*="-24"]'); if (pin) pin.remove();
        await say([['N','And deeper, under the bars, past your arm and your courage: a glint of bronze. Heavy. Bell-shaped, in the way a missing piece is shaped like its absence.']]);
        hint('the notebook felt that · check ✎');
        return;
      }
      if (!st.pullDone){
        st.pullDone = true;
        const saved = G.route==='escort' && G.trust>=49;
        await say([['N','You lean over the grate to look again, and the tune — turns. Toward you. It has found the shape of your name and begun, patiently, to try it on—']]);
        if (saved){
          stealWarmth(2);
          await say([['N','Two knocks. Hard. From the other side of the chapel door — twice, like she taught you without ever teaching you. The tune lets go of your name, annoyed.'],
                     ['N','Two degrees, kept ninety-eight. The door does not open. She is still there.']]);
        } else {
          const tripped = stealWarmth(6);
          await say([['N','—and it fits better than it should. You surface from the sound like surfacing from deep water, six degrees lighter, with the distinct sensation of having been <span class="em">sung about.</span>']]);
          if (tripped) await Scenes.conservatory.ledgerLines();
        }
        return;
      }
      if (!G.flags.clapper) await this.glint();
      else await say([['N','The tune circles. The spaces in it wait. The bell above the dais has an opinion about whose job that is.']]);
    });
  },
  async glint(){
    if (!G.flags.pole){
      await say([['N','You size up the grate, the water, your arm. The water is exactly as deep as your shoulder is long. The math is not in your favor, and the math is the <span class="em">nice</span> one here.']]);
      return;
    }
    if (!G.flags.memento){
      await say([['N','The pole goes through the bars and finds the bronze — and slides off. Wood alone can’t hold it. You need a hook’s patience for this.'],
                 ['T','“…The exhibit stand. In the Conservatory.” You underline it twice.']]);
      return;
    }
    await say([['N','Pole and hook. You thread the ferryman’s tool together for the first time in — how long? It locks with a click like a word finishing.'],
               ['N','Down through the bars, a turn of the wrist the tool seems to remember on its own — and up comes the clapper of the Delford bell, streaming, heavier than its size, like a fare that has waited a long time on the wrong bank.']]);
    G.flags.clapper = true;
    const g = sceneL.querySelector('#glint'); if (g) g.remove();
    hint('the bell is missing exactly this');
  },
  async drownsong(){
    await busy(async ()=>{
      await say([['N','On the altar: the Drownsong. Two spirals wound opposite ways, strung between — a plucked record of old. A brass plate, hand-engraved, matching one you’ve seen across the house: <span class="em">THE DROWNSONG — DO NOT PLUCK.</span>']]);
      if (G.warmth < 65 && !G.flags.memento2)
        await say([['N','The strings are moving. Nothing is plucking them. The tune under the floor matches their trembling — a half-beat behind, like a singer reading her own handwriting.']]);
      if (G.flags.memento2)
        await say([['N','The strings are slack now, at rest. Whatever the spirals were winding toward, it arrived.']]);
    });
  },

  /* ----- the bell & the answer ----- */
  async bell(){
    if (this.mode==='answer'){ this.toll(); return; }
    if (this.mode==='call'){ hint('wait — let the water finish'); return; }
    await busy(async ()=>{
      if (G.flags.memento2){
        await say([['N','The bell is warm. Bells are not warm. This one is.']]);
        return;
      }
      if (!G.flags.clapperInstalled){
        if (!G.flags.clapper){
          await say([['N','You pull the rope. The bell swings, grand and earnest and <span class="em">silent</span> — a mouth with no tongue. The quiet afterward is somehow ruder than noise.']]);
          sceneL.querySelector('#bellSwing').classList.add('toll');
          setTimeout(()=>{ const b = sceneL.querySelector('#bellSwing'); if (b) b.classList.remove('toll'); }, 600);
          return;
        }
        await say([['N','You climb the dais rail, reach into the bell’s dark, and hang the clapper on its worn hook. It settles like a tongue remembering the roof of its mouth.']]);
        G.flags.clapperInstalled = true;
        sceneL.querySelector('#bellSwing').innerHTML += '<line x1="790" y1="150" x2="790" y2="184" stroke="#5c4a28" stroke-width="4"/><circle cx="790" cy="188" r="6" fill="#6d5a3a"/>';
        await say([['N','Below, the tune under the floor pauses. The whole cistern, mid-phrase — listening.'],
                   ['N','It begins again. Slowly. Deliberately. It is going to call. When it leaves the space — <span class="em">answer with the same count.</span>']]);
        this.startRound();
        return;
      }
      this.startRound();
    });
  },
  startRound(){
    this.mode = 'call'; this.tolls = 0;
    const k = this.COUNTS[this.round];
    hint('listen…');
    this.callT.forEach(clearTimeout); this.callT = [];
    const rip = sceneL.querySelector('#ripples');
    for (let i=0;i<k;i++){
      this.callT.push(setTimeout(()=>{
        if (Snd.ctx) this.callTone(Snd.ctx.currentTime + 0.02);
        if (rip){ rip.style.opacity = 1; setTimeout(()=>{ if (rip) rip.style.opacity = .5; }, 260); }
      }, 500 + i*620));
    }
    this.callT.push(setTimeout(()=>{
      this.mode = 'answer';
      hint(`answer — pull the rope (${k} calls)`);
    }, 500 + k*620 + 300));
  },
  toll(){
    this.tolls++;
    this.tollSound();
    const b = sceneL.querySelector('#bellSwing');
    if (b){ b.classList.remove('toll'); void b.getBoundingClientRect(); b.classList.add('toll'); }
    clearTimeout(this.evalT);
    this.evalT = setTimeout(()=>this.judge(), 1500);
  },
  async judge(){
    const k = this.COUNTS[this.round];
    this.mode = 'idle';
    if (this.tolls === k){
      this.round++;
      if (this.round >= this.COUNTS.length){ this.answered(); return; }
      hint('…the water accepts. It calls again, longer');
      setTimeout(()=>{ if (!D.el.classList.contains('on')) this.startRound(); }, 900);
    } else {
      await busy(async ()=>{
        stealWarmth(2);
        await say([['N','The count lands wrong. The water sighs — a long, disappointed exhale that takes two degrees with it — and gathers itself to ask again.']]);
      });
      this.tolls = 0;
      this.startRound();
    }
  },
  async answered(){
    this.mode = 'done';
    G.flags.memento2 = true;
    Snd.play('legs', 2.5);
    await busy(async ()=>{
      await say([['N','The third answer lands — and the bell, unpulled, rings once more on its own. Deep. Clean. A note held out like a hand.'],
                 ['N','Under the floor, the tune rises to meet it — and for one measure the call and the answer are the same song, passing something between them—'],
                 ['N','—and the water goes still. Not empty-still. <span class="em">Finished</span>-still. Somewhere in the pipes of the house, something that has been holding its breath for a very long time lets it out in rhythm.']]);
      const rip = sceneL.querySelector('#ripples'); if (rip) rip.style.opacity = 0;
      const sh = sceneL.querySelectorAll('#hsPews g'); sh.forEach((el,i)=>{ if (i>0) el.remove(); });
      await say([['N','On the grate — you did not see it happen; you were not meant to — Elah’s hairpin now sits on top of the iron. Dry. Placed. The way you set a thing down when you are returning it.']]);
      if (G.route==='escort'){
        if (G.trust >= 59){
          spritesL.innerHTML += saskiaSVG(150, 388);
          setFace('longlook');
          await say([['N','Saskia is standing three steps inside the chapel. She did not decide to; her feet clearly outvoted her.'],
                     ['S','“It hasn’t sounded like that since—” She keeps the rest. She stays anyway. That’s the sentence.']]);
        } else {
          await say([['N','Through the gap in the door, a strip of foyer light — and her shadow across it, not moving, for a long time. The shadow of someone listening to jazz through a wall and calling it keeping watch.']]);
        }
      }
      hint('the chapel is answered');
    });
  },
  async leave(){
    await busy(async ()=>{ go('foyer'); });
  },
};

/* ---------- helpers ---------- */
function say(lines){
  const nodes = {};
  lines.forEach((l, i)=>{
    nodes['s'+i] = { sp:l[0], text:l[1], ...(i < lines.length-1 ? {next:'s'+(i+1)} : {end:true}) };
  });
  return D.run(nodes, 's0');
}
async function busy(fn){ Tom.busy = true; try { await fn(); } finally { Tom.busy = false; } }
let hintT = null;
function hint(t){
  const el = $('#hint');
  clearTimeout(hintT);
  if (!t){ el.classList.remove('on'); return; }
  el.textContent = t; el.classList.add('on');
  hintT = setTimeout(()=>el.classList.remove('on'), 2600);
}

/* ================================================================
   NOTEBOOK
   ================================================================ */
$('#notebookBtn').addEventListener('click', openNotebook);
function openNotebook(){
  $('#notebookBtn').classList.remove('pulse');
  const lost = Math.round(100 - G.warmth);
  const frostH = lost <= 0 ? 0 : Math.min(84, 16 + 66*lost/100);
  const wStatus = G.flags.memento ? 'quieted (?)' : G.flags.page ? 'traces: C.T.' : G.seen.consIntro ? 'the mist rises' : 'unvisited';
  const dStatus = G.flags.memento2 ? 'ANSWERED' : G.flags.elahPin ? 'traces: E.B.' : G.seen.chapelIntro ? 'the call waits' : 'unvisited';
  const legends = [
    ['Mystery at Ruby Hills','unvisited'], ['Shapes Under the Mist', wStatus],
    ['Saywardbury · the Doeling','unvisited'], ['Drownsong · the Bell', dStatus],
    ['Omendaria’s Living Thread','unvisited'], ['Lanterna’s Rest · the Twins','unvisited'],
    ['Kassera’s Plunge · Headlesses','unvisited'], ['The Graincross Herald','unvisited'],
  ];
  const carrying = [G.flags.pole && 'the punt pole', G.flags.page && 'Corwen’s page',
    G.flags.memento && (G.flags.pole ? 'the ferryman’s hook (mounted)' : 'the ferryman’s hook'),
    G.flags.clapper && !G.flags.clapperInstalled && 'the Delford clapper']
    .filter(Boolean).join(' · ') || 'nothing but this notebook';
  const ov = $('#overlay');
  ov.innerHTML = `
    <div class="book" role="dialog" aria-label="Tomren's notebook">
      <div class="page">
        <h3>The Project</h3>
        <p class="sub">eight legends, eight chapters — T. South, E. Bellwether, C. Thrushwick</p>
        <ul class="legends">${legends.map(([l,s])=>`<li><span>${l}</span><span class="st">${s}</span></li>`).join('')}</ul>
        <p class="sub" style="margin-top:14px">carrying: ${carrying}</p>
        ${G.flags.corwenSlip ? '<p class="sub redline">she started to say his name. at the pond. nobody asked her to.</p>' : ''}
      </div>
      <div class="page">
        <h3>The Ledger</h3>
        <p class="sub">warmth, as best I can measure it: my glasses</p>
        <svg viewBox="0 0 200 74" width="100%" aria-label="warmth gauge">
          <defs><clipPath id="gcut"><rect x="0" y="0" width="200" height="${frostH.toFixed(0)}"/></clipPath></defs>
          <g fill="none" stroke="#241f1a" stroke-width="3">
            <circle cx="62" cy="44" r="26"/><circle cx="138" cy="44" r="26"/>
            <path d="M88,44 C96,38 104,38 112,44"/>
            <path d="M36,44 L16,36"/><path d="M164,44 L184,36"/>
          </g>
          <g clip-path="url(#gcut)">
            <circle cx="62" cy="44" r="24" fill="#bcd7e6" opacity=".85"/>
            <circle cx="138" cy="44" r="24" fill="#bcd7e6" opacity=".85"/>
            <g stroke="#8fb2c8" stroke-width="1.4" opacity=".8">
              <path d="M50,30 l8,10 M60,26 l4,12 M72,30 l-6,10"/>
              <path d="M126,30 l8,10 M136,26 l4,12 M148,30 l-6,10"/>
            </g>
          </g>
          <line x1="8" y1="42" x2="192" y2="42" stroke="var(--red)" stroke-width="1.6" stroke-dasharray="5 4"/>
        </svg>
        <p class="sub" style="text-align:center;margin:2px 0 8px">the ledger line — below it, the good ending does not survive</p>
        <p class="stat" style="margin:6px 0 10px">warmth <b>${G.warmth}%</b> · lowest today <b>${G.minWarmth}%</b> · ledger ${G.ledgerTripped ? '<b>BELOW THE LINE</b>' : 'clean'}<br>the brazier by the front door ${roomsCleared() >= 4 ? 'has <b>gone cold</b>' : 'still burns'}</p>
        <div class="people">
          <h3>People</h3>
          <p><b>Saskia Maren</b> — resting face: <span class="redline">${faceLabel()}</span>${G.route ? ' · '+(G.route==='escort'?'watching me':'in the kitchen') : ''}</p>
          <p><b>Elah Bellwether</b> — <span class="note">missing, 61 days</span></p>
          <p><b>Corwen Thrushwick</b> — <span class="note">missing, 61 days</span></p>
        </div>
      </div>
      <div class="navRow">
        <button class="navBtn" id="nbRestart">⟲ restart this area</button>
        <button class="navBtn" id="nbTitle">↩ return to title</button>
      </div>
      <button id="ovClose" aria-label="close">✕</button>
    </div>`;
  ov.classList.add('on');
  ov.addEventListener('click', e=>{ if (e.target === ov || e.target.id === 'ovClose') closeOverlay(); });
  $('#nbRestart').addEventListener('click', e=>{ e.stopPropagation(); if (G.scene==='foyer' || G.scene==='conservatory') restartArea(); });
  $('#nbTitle').addEventListener('click',   e=>{ e.stopPropagation(); returnToTitle(); });
}
function closeOverlay(){ $('#overlay').classList.remove('on'); $('#overlay').innerHTML=''; }
addEventListener('keydown', e=>{ if (e.key === 'Escape') closeOverlay(); });

/* ================================================================
   HERALD CARDS
   ================================================================ */
function heraldShell(inner, cls=''){
  const ov = $('#overlay');
  ov.innerHTML = `<div class="herald ${cls}">
    <div class="masthead"><h2>THE GRAINCROSS HERALD</h2>
    <p>serving the valley towns since before the valley agreed to it</p></div>${inner}</div>`;
  ov.classList.add('on');
}
function gameOverDoor(){
  heraldShell(`
    <h1>STUDENT STANDS ON PORCH; DOOR DECLINES COMMENT</h1>
    <p class="deck">Maren Estate remains, per tradition, a house other people are outside of</p>
    <div class="cols">
      <p>Senior Tomren South, 18, was observed Thursday attempting journalism at the Maren Estate. Witnesses describe the door as “closed,” a position it maintained throughout.</p>
      <p>The Estate could not be reached for comment, which residents note is the Estate’s whole thing. Mr. South’s folklore project remains, at press time, eight-ninths unwritten.</p>
    </div>
    <div class="heraldBtns"><button class="choice" id="retry">knock again</button></div>`, 'clip');
  $('#retry').addEventListener('click', ()=>{
    closeOverlay(); resetGame(); go('doorstep');
  });
}
function resetGame(){
  Object.assign(G, {trust:50, warmth:100, minWarmth:100, route:null, flags:{}, seen:{},
    coldCount:0, ledgerTripped:false, cons:null});
  applyWarmth();
}
function roomsCleared(){
  return ['memento','memento2','memento3','memento4','memento5','memento6','memento7','memento8']
    .filter(k=>G.flags[k]).length;
}
function unstick(){
  D.abort();
  Tom.busy = false; Tom.pending = null;
  Scenes.conservatory.hopping = false;
}
function returnToTitle(){
  closeOverlay(); unstick();
  resetGame(); Snd.stop(1); Snd.clockStop();
  go('title');
}
function restartArea(){
  closeOverlay(); unstick();
  if (G.scene === 'conservatory') G.cons = null;
  if (G.scene === 'chapel') G.chap = null;
  go(G.scene);
}
function endCard(){
  const route = G.route === 'alone' ? 'unaccompanied — the keeper trusts him, or has stopped arguing with the house' : 'under escort, keys in hand';
  const seen = ['chand','ninth','pole','cellar','east'].filter(k=>G.seen[k]).length;
  heraldShell(`
    <h1>SOUTH ENTERS MAREN ESTATE</h1>
    <p class="deck">first afternoon ends without incident, according to increasingly careful definitions of incident</p>
    <div class="cols">
      <p class="stat">The visitor toured the foyer <b>${route}</b>. Sources describe the keeper’s resting expression as <b>${faceLabel()}</b>.</p>
      <p class="stat">Warmth at close of business: <b>${G.warmth}%</b> (day’s low <b>${G.minWarmth}%</b>). The ledger is <b>${G.ledgerTripped ? 'BELOW THE LINE' : 'clean'}</b>. Curiosities examined: <b>${seen} of 5</b>.</p>
      ${G.flags.memento ? '<p class="stat">REMOVED FROM EXHIBITION: one ferryman’s hook. The Conservatory has changed its song and declines to change it back.</p>' : ''}
      ${G.flags.page ? '<p class="stat">RECOVERED: one page, C. Thrushwick’s hand, ferry-log research, final word unfinished.</p>' : ''}
      ${G.flags.memento2 ? '<p class="stat">ANSWERED: the Delford bell, restored to conversation after a long professional silence. The chapel has since been heard, credibly, <b>swinging</b>.</p>' : ''}
      <p>NEXT EDITION — the eight rooms open one by one: the Valley Parlor and its restless model, the Conservatory fog, the Nursery hoofprints, the silenced Chapel bell, the Tapestry that remembers yesterday, the twin lanterns, the Plunge Bath and its shell mirror, and the Archive where a certain student pins the truth together.</p>
      <p><i>That’s the whole slice, Clarey — come tell the Herald what to build next.</i></p>
    </div>
    <div class="heraldBtns"><button class="choice" id="again">play it again</button></div>`);
  $('#again').addEventListener('click', ()=>{
    closeOverlay(); resetGame(); go('doorstep');
  });
}

/* ================================================================
   SCENE ROUTER
   ================================================================ */
let current = null;
function go(name){
  if (current && Scenes[current].exit) Scenes[current].exit();
  current = name; G.scene = name;
  Scenes[name].enter();
}
go('title');
</script>
